<script type="text/javascript" src="./components/js/file-listing.js"></script>
<div class="file-list files-color overflow-x-auto w-full" x-data="fileListing" x-bind:class="{'ignore-listing': isIgnoreMode}">
  <table class="table table-pin-rows table-pin-cols" x-ref="fileListTable">
    <thead>
      <tr>
        <th class="col-checkbox" data-field="checkbox" width="32"><input type="checkbox" id="select-all" class="checkbox checkbox-sm" x-on:click="toggleSelectAll"></th>
        <td data-field="file" x-on:click="sortFiles">文件</td>
        <td data-field="time" order-by="timestamp" x-on:click="sortFiles">最后修改时间</td>
        <td data-field="statusLabel" order-by="status" x-on:click="sortFiles">状态</td>
        <td data-field="ext" x-on:click="sortFiles">文件类型</td>
        <td data-field="fsize" order-by="size" x-on:click="sortFiles">大小</td>
      </tr>
    </thead>
    <tbody x-on:keydown="keyboardSelectFile">
      <template x-for="file in files" :key="file.absPath">
        <tr :class="rowClass(file)" x-on:click="clickRow.bind($data, $event, $el, file)">
          <th class="col-checkbox"><input type="checkbox" x-model="file.selected" x-bind:data-file="file.file" class="checkbox checkbox-sm" /></th>
          <td x-text="file.file" :data-title="rowClasses[file.file] ? '未跟踪的文件 (' + untrackedCount + ')' : ''" x-on:contextmenu="showPathContextMenu.bind($data, file)" x-on:dblclick="showDiff.bind($data, file)"></td>
          <td x-text="file.time"></td>
          <td x-text="file.statusLabel"></td>
          <td x-text="file.ext"></td>
          <td class="text-right" x-text="file.fsize"></td>
        </tr>
      </template>
    </tbody>
  </table>
  <template x-if="currentFilesCount === 0">
  <div class="py-4 text-center" x-text="isIgnoreMode ? '没有已被隐藏的文件' : '没有需要提交的文件'"></div>
  </template>
</div>
